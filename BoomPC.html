<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BoomPC · 手机射击</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a14;
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }

        /* PC遮罩 */
        #pcOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 20, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        #pcOverlay.hidden {
            display: none;
        }
        #pcOverlay .icon {
            font-size: 72px;
            margin-bottom: 16px;
            animation: shake 2s ease-in-out infinite;
        }
        @keyframes shake {
            0%,
            100% {
                transform: rotate(-5deg) scale(1);
            }
            50% {
                transform: rotate(5deg) scale(1.05);
            }
        }
        #pcOverlay h1 {
            color: #f472b6;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 50px rgba(244, 114, 182, 0.3);
        }
        #pcOverlay p {
            color: #8899bb;
            font-size: 18px;
            line-height: 1.8;
            max-width: 360px;
            margin-top: 8px;
        }
        #pcOverlay .emoji-row {
            font-size: 40px;
            letter-spacing: 16px;
            margin: 20px 0 8px;
        }

        /* 游戏容器 */
        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #0a0a14;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            background: transparent;
            cursor: none;
        }

        /* HUD - 使用HTML覆盖层，更清晰 */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 14px 18px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, transparent 100%);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #hud .left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #hud .score-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }
        #hud .score-value {
            color: #fff;
            font-size: 32px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
            line-height: 1;
        }
        #hud .score-value span {
            color: #a78bfa;
        }
        #hud .lives {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
            margin-top: 4px;
        }
        #hud .lives .life-icon {
            transition: all 0.3s ease;
        }
        #hud .lives .life-icon.lost {
            opacity: 0.15;
            transform: scale(0.6);
        }
        #hud .combo {
            color: rgba(255, 215, 0, 0.7);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #hud .combo.show {
            opacity: 1;
        }
        #hud .right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }
        #hud .diff-label {
            color: rgba(255, 255, 255, 0.15);
            font-size: 10px;
            letter-spacing: 2px;
        }
        #hud .diff-bar {
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 2px;
        }
        #hud .diff-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #f472b6);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* UI覆盖层（开始/结束） */
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #uiOverlay.active {
            pointer-events: auto;
        }

        .ui-panel {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 36px 32px 40px;
            max-width: 360px;
            width: 88%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            display: none;
        }
        .ui-panel.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            display: block;
        }

        .ui-panel .game-title {
            font-size: 44px;
            font-weight: 900;
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: 0 0 60px rgba(167, 139, 250, 0.15);
        }
        .ui-panel .subtitle {
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            letter-spacing: 6px;
            margin: 4px 0 20px;
            font-weight: 300;
        }
        .ui-panel .subtitle .boom {
            color: #f472b6;
            font-weight: 700;
        }
        .ui-panel .desc {
            color: rgba(255, 255, 255, 0.4);
            font-size: 15px;
            line-height: 1.7;
            margin: 8px 0 24px;
        }
        .ui-panel .desc .emoji-big {
            display: block;
            font-size: 48px;
            letter-spacing: 8px;
            margin: 8px 0 4px;
        }

        .ui-panel .score-final {
            font-size: 64px;
            font-weight: 800;
            color: #fff;
            margin: 4px 0;
        }
        .ui-panel .score-final .highlight {
            color: #f472b6;
        }
        .ui-panel .best-score {
            color: rgba(255, 215, 0, 0.5);
            font-size: 16px;
            font-weight: 600;
            margin: 4px 0 16px;
        }
        .ui-panel .best-score span {
            color: #ffd700;
        }

        .btn {
            display: inline-block;
            padding: 16px 48px;
            border: none;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 32px rgba(167, 139, 250, 0.25);
            letter-spacing: 1px;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }
        .btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 16px rgba(167, 139, 250, 0.15);
        }
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:active::after {
            opacity: 1;
        }

        .btn-restart {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            box-shadow: 0 8px 32px rgba(244, 114, 182, 0.25);
        }

        .btn .icon-btn {
            margin-right: 8px;
        }

        /* 响应式 */
        @media (max-width: 420px) {
            .ui-panel {
                padding: 28px 20px 32px;
                border-radius: 32px;
            }
            .ui-panel .game-title {
                font-size: 34px;
            }
            .ui-panel .score-final {
                font-size: 48px;
            }
            .btn {
                padding: 14px 32px;
                font-size: 17px;
            }
            #hud .score-value {
                font-size: 26px;
            }
            #hud .lives {
                font-size: 20px;
            }
        }

        @media (max-height: 640px) {
            .ui-panel {
                padding: 20px 16px 24px;
            }
            .ui-panel .game-title {
                font-size: 28px;
            }
            .ui-panel .desc {
                font-size: 13px;
                margin: 4px 0 12px;
            }
            .ui-panel .desc .emoji-big {
                font-size: 32px;
            }
            .ui-panel .score-final {
                font-size: 38px;
            }
            .btn {
                padding: 10px 28px;
                font-size: 15px;
            }
            #hud {
                padding: 10px 14px 6px;
            }
            #hud .score-value {
                font-size: 22px;
            }
            #hud .lives {
                font-size: 18px;
            }
        }

        @supports (padding: max(0px)) {
            #hud {
                padding-left: max(18px, env(safe-area-inset-left));
                padding-right: max(18px, env(safe-area-inset-right));
                padding-top: max(14px, env(safe-area-inset-top));
            }
            .ui-panel {
                padding-left: max(32px, env(safe-area-inset-left));
                padding-right: max(32px, env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>

    <!-- PC遮罩 -->
    <div id="pcOverlay">
        <div class="icon">🔫</div>
        <h1>BoomPC</h1>
        <p>这是一款 <strong>仅限手机</strong> 的触控射击游戏</p>
        <p style="font-size:15px; color:#667; margin-top:4px;">请用手机打开，体验爆破快感</p>
        <div class="emoji-row">💻 🖥️ ⌨️ 🖱️</div>
    </div>

    <!-- 游戏容器 -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="left">
                <div class="score-label">得分</div>
                <div class="score-value"><span id="scoreDisplay">0</span></div>
                <div class="lives" id="livesDisplay"></div>
                <div class="combo" id="comboDisplay">🔥 连击 x<span id="comboCount">0</span></div>
            </div>
            <div class="right">
                <div class="diff-label">难度</div>
                <div class="diff-bar"><div class="fill" id="diffFill"></div></div>
            </div>
        </div>

        <!-- UI覆盖层 -->
        <div id="uiOverlay">
            <!-- 开始面板 -->
            <div id="startPanel" class="ui-panel visible">
                <div class="game-title">BoomPC</div>
                <div class="subtitle">💥 爆破 <span class="boom">PC</span> 元素 💥</div>
                <div class="desc">
                    滑动手指控制飞船左右移动
                    <span class="emoji-big">🚀 💻 🖥️ ⌨️</span>
                    自动开火 · 击落所有PC！
                </div>
                <button class="btn" id="startBtn">🚀 开始爆破</button>
            </div>

            <!-- 结束面板 -->
            <div id="endPanel" class="ui-panel">
                <div class="game-title" style="font-size:28px; background:linear-gradient(135deg,#f472b6,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">💥 爆破结束</div>
                <div class="score-final"><span class="highlight" id="finalScore">0</span></div>
                <div class="best-score">🏆 最高纪录 <span id="bestScore">0</span></div>
                <div style="font-size:36px; letter-spacing:6px; margin:4px 0 8px;" id="endEmoji">💻</div>
                <button class="btn btn-restart" id="restartBtn">🔄 再来一局</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // --- 检测触摸设备 ---
            const isTouch = ('ontouchstart' in window) ||
                (navigator.maxTouchPoints > 0) ||
                (navigator.msMaxTouchPoints > 0);

            const pcOverlay = document.getElementById('pcOverlay');
            if (!isTouch) {
                pcOverlay.classList.remove('hidden');
                return;
            } else {
                pcOverlay.classList.add('hidden');
            }

            // --- DOM 引用 ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const comboDisplay = document.getElementById('comboDisplay');
            const comboCount = document.getElementById('comboCount');
            const diffFill = document.getElementById('diffFill');
            const finalScoreEl = document.getElementById('finalScore');
            const bestScoreEl = document.getElementById('bestScore');
            const endEmojiEl = document.getElementById('endEmoji');
            const startPanel = document.getElementById('startPanel');
            const endPanel = document.getElementById('endPanel');
            const uiOverlay = document.getElementById('uiOverlay');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');

            // --- Canvas 尺寸 ---
            let W, H, scale;

            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                W = rect.width;
                H = rect.height;
                canvas.width = W * (window.devicePixelRatio || 1);
                canvas.height = H * (window.devicePixelRatio || 1);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                scale = (window.devicePixelRatio || 1);
                ctx.setTransform(scale, 0, 0, scale, 0, 0);
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => {
                setTimeout(resizeCanvas, 300);
            });

            // --- 游戏常量 ---
            const PLAYER_RADIUS = 24;
            const BULLET_RADIUS = 4;
            const MAX_LIVES = 5;
            const BASE_FIRE_INTERVAL = 8; // frames
            const BASE_ENEMY_SPAWN = 40; // frames
            const BASE_ENEMY_SPEED = 1.2;

            // --- 游戏状态 ---
            const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
            let state = STATE.MENU;
            let score = 0;
            let lives = MAX_LIVES;
            let bestScore = parseInt(localStorage.getItem('boomPC_best')) || 0;
            let frameCount = 0;
            let fireCounter = 0;
            let spawnCounter = 0;
            let difficulty = 1;
            let combo = 0;
            let maxCombo = 0;

            // --- 玩家 ---
            const player = {
                x: 0,
                y: 0,
                radius: PLAYER_RADIUS,
                targetX: 0,
                speed: 0.25,
                engineGlow: 0,
            };

            // --- 子弹 ---
            let bullets = [];

            // --- 敌人 ---
            let enemies = [];
            const PC_EMOJIS = ['💻', '🖥️', '⌨️', '🖱️', '🖨️', '💾', '📀', '📠', '🖲️', '📡'];
            const ENEMY_COLORS = ['#f472b6', '#a78bfa', '#60a5fa', '#34d399', '#fbbf24', '#fb923c', '#f87171', '#e879f9'];

            // --- 粒子 ---
            let particles = [];

            // --- 星星背景 ---
            let stars = [];

            // --- 触摸 ---
            let isTouching = false;
            let touchX = 0;

            // --- 初始化星星 ---
            function initStars() {
                stars = [];
                for (let i = 0; i < 80; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.5 + 0.5,
                        a: Math.random() * 0.8 + 0.2,
                        speed: Math.random() * 0.2 + 0.05,
                    });
                }
            }
            initStars();

            // ============================================================
            //  工具函数
            // ============================================================
            function rand(min, max) { return Math.random() * (max - min) + min; }

            function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

            function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function lerp(a, b, t) { return a + (b - a) * t; }

            function randomColor() {
                return ENEMY_COLORS[randInt(0, ENEMY_COLORS.length - 1)];
            }

            // ============================================================
            //  粒子系统
            // ============================================================
            function emitExplosion(x, y, count, color, speed, life) {
                for (let i = 0; i < count; i++) {
                    const angle = rand(0, Math.PI * 2);
                    const spd = rand(0.8, speed);
                    const colors = [color, '#fff', '#fbbf24', '#f472b6', '#a78bfa'];
                    const c = colors[randInt(0, colors.length - 1)];
                    particles.push({
                        x: x + rand(-4, 4),
                        y: y + rand(-4, 4),
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - rand(0, 0.5),
                        radius: rand(2, 6),
                        life: rand(life * 0.5, life),
                        maxLife: life,
                        color: c,
                        decay: rand(0.96, 0.995),
                        type: 'spark',
                    });
                }
                // 加一些烟雾粒子
                for (let i = 0; i < count * 0.3; i++) {
                    const angle = rand(0, Math.PI * 2);
                    const spd = rand(0.3, 1.5);
                    particles.push({
                        x: x + rand(-6, 6),
                        y: y + rand(-6, 6),
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - 0.3,
                        radius: rand(4, 12),
                        life: rand(life * 0.3, life * 0.7),
                        maxLife: life,
                        color: 'rgba(200,200,255,0.15)',
                        decay: 0.99,
                        type: 'smoke',
                    });
                }
            }

            function emitScoreParticles(x, y) {
                const count = 12;
                for (let i = 0; i < count; i++) {
                    const angle = rand(0, Math.PI * 2);
                    const spd = rand(1, 3);
                    particles.push({
                        x: x + rand(-6, 6),
                        y: y + rand(-6, 6),
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - 1.5,
                        radius: rand(2, 5),
                        life: rand(20, 45),
                        maxLife: 45,
                        color: '#ffd700',
                        decay: 0.98,
                        type: 'spark',
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.03;
                    p.vx *= p.decay || 0.99;
                    p.vy *= p.decay || 0.99;
                    p.life--;
                    if (p.life <= 0 || p.y > H + 30 || p.x < -30 || p.x > W + 30) {
                        particles.splice(i, 1);
                    }
                }
            }

            function drawParticles() {
                for (const p of particles) {
                    const alpha = clamp(p.life / p.maxLife, 0, 1);
                    ctx.globalAlpha = alpha * 0.9;
                    if (p.type === 'smoke') {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius * (1 + (1 - alpha) * 0.8), 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    } else {
                        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 1.5);
                        grad.addColorStop(0, p.color || '#fff');
                        grad.addColorStop(1, 'transparent');
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius * 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = grad;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
                        ctx.fillStyle = p.color || '#fff';
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }

            // ============================================================
            //  玩家
            // ============================================================
            function updatePlayer() {
                player.x = lerp(player.x, player.targetX, player.speed);
                player.x = clamp(player.x, player.radius + 4, W - player.radius - 4);
                player.y = H - 60 - player.radius;
                player.engineGlow = (player.engineGlow + 0.1) % (Math.PI * 2);
            }

            function drawPlayer() {
                const x = player.x;
                const y = player.y;
                const r = player.radius;

                // 引擎光晕
                const grad = ctx.createRadialGradient(x, y + r + 10, 2, x, y + r + 10, r * 1.6);
                const glowAlpha = 0.3 + 0.15 * Math.sin(player.engineGlow);
                grad.addColorStop(0, `rgba(167, 139, 250, ${glowAlpha})`);
                grad.addColorStop(0.4, `rgba(167, 139, 250, ${glowAlpha * 0.4})`);
                grad.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(x, y + r + 10, r * 1.6, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // 引擎火焰
                const flameLen = 10 + 6 * Math.sin(player.engineGlow * 1.5);
                ctx.beginPath();
                ctx.moveTo(x - 8, y + r - 2);
                ctx.quadraticCurveTo(x - 12, y + r + flameLen, x, y + r + flameLen + 6);
                ctx.quadraticCurveTo(x + 12, y + r + flameLen, x + 8, y + r - 2);
                ctx.fillStyle = `rgba(244, 114, 182, ${0.5 + 0.2 * Math.sin(player.engineGlow * 2)})`;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x - 5, y + r - 2);
                ctx.quadraticCurveTo(x - 7, y + r + flameLen * 0.6, x, y + r + flameLen * 0.8);
                ctx.quadraticCurveTo(x + 7, y + r + flameLen * 0.6, x + 5, y + r - 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${0.3 + 0.2 * Math.sin(player.engineGlow * 1.7 + 1)})`;
                ctx.fill();

                // 飞船主体
                ctx.save();
                ctx.shadowColor = '#a78bfa';
                ctx.shadowBlur = 20;

                // 机身
                const grad2 = ctx.createLinearGradient(x - r, y, x + r, y);
                grad2.addColorStop(0, '#6d28d9');
                grad2.addColorStop(0.3, '#8b5cf6');
                grad2.addColorStop(0.7, '#a78bfa');
                grad2.addColorStop(1, '#7c3aed');
                ctx.beginPath();
                ctx.moveTo(x, y - r - 6);
                ctx.quadraticCurveTo(x + r * 1.3, y - r * 0.3, x + r * 0.9, y + r * 0.6);
                ctx.quadraticCurveTo(x + r * 0.5, y + r * 0.9, x, y + r * 0.7);
                ctx.quadraticCurveTo(x - r * 0.5, y + r * 0.9, x - r * 0.9, y + r * 0.6);
                ctx.quadraticCurveTo(x - r * 1.3, y - r * 0.3, x, y - r - 6);
                ctx.closePath();
                ctx.fillStyle = grad2;
                ctx.fill();
                ctx.strokeStyle = 'rgba(167, 139, 250, 0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.shadowBlur = 0;

                // 驾驶舱
                const grad3 = ctx.createRadialGradient(x - 2, y - r * 0.2, 2, x, y - r * 0.1, r * 0.5);
                grad3.addColorStop(0, 'rgba(255,255,255,0.5)');
                grad3.addColorStop(0.5, 'rgba(167, 139, 250, 0.2)');
                grad3.addColorStop(1, 'rgba(167, 139, 250, 0.05)');
                ctx.beginPath();
                ctx.ellipse(x, y - r * 0.1, r * 0.5, r * 0.45, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad3;
                ctx.fill();

                // 高光
                ctx.beginPath();
                ctx.ellipse(x - r * 0.25, y - r * 0.45, r * 0.15, r * 0.08, -0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fill();

                // 机翼装饰
                ctx.beginPath();
                ctx.moveTo(x - r * 1.1, y + r * 0.1);
                ctx.lineTo(x - r * 0.7, y + r * 0.4);
                ctx.lineTo(x - r * 0.5, y + r * 0.2);
                ctx.fillStyle = 'rgba(167, 139, 250, 0.15)';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(x + r * 1.1, y + r * 0.1);
                ctx.lineTo(x + r * 0.7, y + r * 0.4);
                ctx.lineTo(x + r * 0.5, y + r * 0.2);
                ctx.fillStyle = 'rgba(167, 139, 250, 0.15)';
                ctx.fill();

                ctx.restore();

                // 护盾光环 (低频呼吸)
                const shieldAlpha = 0.04 + 0.03 * Math.sin(frameCount * 0.02);
                ctx.beginPath();
                ctx.arc(x, y, r + 12, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(167, 139, 250, ${shieldAlpha})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 8]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // ============================================================
            //  子弹
            // ============================================================
            function fireBullet() {
                const x = player.x;
                const y = player.y - player.radius - 4;
                bullets.push({
                    x: x,
                    y: y,
                    radius: BULLET_RADIUS,
                    speed: 8 + difficulty * 0.3,
                    trail: [],
                });
            }

            function updateBullets() {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.trail.push({ x: b.x, y: b.y });
                    if (b.trail.length > 6) b.trail.shift();
                    b.y -= b.speed;
                    if (b.y < -20) {
                        bullets.splice(i, 1);
                    }
                }
            }

            function drawBullets() {
                for (const b of bullets) {
                    // 拖尾
                    for (let t = 0; t < b.trail.length; t++) {
                        const alpha = t / b.trail.length * 0.5;
                        const r = b.radius * (0.3 + 0.7 * (t / b.trail.length));
                        ctx.beginPath();
                        ctx.arc(b.trail[t].x, b.trail[t].y, r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(167, 139, 250, ${alpha})`;
                        ctx.fill();
                    }
                    // 子弹主体
                    const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.radius * 2);
                    grad.addColorStop(0, '#fff');
                    grad.addColorStop(0.3, '#c4b5fd');
                    grad.addColorStop(1, 'rgba(167, 139, 250, 0)');
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 2, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#e8e0ff';
                    ctx.fill();
                    ctx.shadowColor = '#a78bfa';
                    ctx.shadowBlur = 16;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ============================================================
            //  敌人
            // ============================================================
            function spawnEnemy() {
                const emoji = PC_EMOJIS[randInt(0, PC_EMOJIS.length - 1)];
                const color = randomColor();
                const size = rand(26, 42);
                const x = rand(size + 4, W - size - 4);
                const y = -size;
                const speed = BASE_ENEMY_SPEED + difficulty * 0.15 + rand(0, 0.3);
                enemies.push({
                    x: x,
                    y: y,
                    size: size,
                    emoji: emoji,
                    color: color,
                    speed: speed,
                    rotation: rand(0, Math.PI * 2),
                    rotSpeed: rand(-0.02, 0.02),
                    wobble: rand(0, 0.4),
                    wobbleSpeed: rand(0.01, 0.03),
                    phase: rand(0, Math.PI * 2),
                    hp: 1,
                    hitFlash: 0,
                });
            }

            function updateEnemies() {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.y += e.speed;
                    e.rotation += e.rotSpeed;
                    e.x += Math.sin(e.phase) * e.wobble;
                    e.phase += e.wobbleSpeed;
                    if (e.hitFlash > 0) e.hitFlash--;

                    // 到达底部
                    if (e.y > H + 30) {
                        enemies.splice(i, 1);
                        loseLife();
                        continue;
                    }

                    // 碰撞检测 - 玩家
                    const d = dist(player.x, player.y, e.x, e.y);
                    if (d < player.radius + e.size * 0.4) {
                        emitExplosion(e.x, e.y, 30, e.color, 5, 40);
                        enemies.splice(i, 1);
                        loseLife();
                        continue;
                    }
                }
            }

            function drawEnemies() {
                for (const e of enemies) {
                    const x = e.x;
                    const y = e.y;
                    const s = e.size;

                    // 光晕
                    const grad = ctx.createRadialGradient(x, y, s * 0.1, x, y, s * 0.8);
                    grad.addColorStop(0, e.color + '30');
                    grad.addColorStop(1, 'transparent');
                    ctx.beginPath();
                    ctx.arc(x, y, s * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // 命中闪白
                    if (e.hitFlash > 0) {
                        ctx.shadowColor = '#fff';
                        ctx.shadowBlur = 40;
                    }

                    // Emoji
                    ctx.font = `${s}px -apple-system, "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = e.color + '60';
                    ctx.shadowBlur = 25;
                    ctx.fillText(e.emoji, x, y + 2);
                    ctx.shadowBlur = 0;

                    // 小光晕
                    ctx.beginPath();
                    ctx.arc(x, y, s * 0.35, 0, Math.PI * 2);
                    const grad2 = ctx.createRadialGradient(x, y, 0, x, y, s * 0.35);
                    grad2.addColorStop(0, 'rgba(255,255,255,0.06)');
                    grad2.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad2;
                    ctx.fill();

                    // 生命值指示器（如果有多血量，但这里都是一击必杀，所以不显示）
                }
            }

            // ============================================================
            //  碰撞检测（子弹 vs 敌人）
            // ============================================================
            function checkCollisions() {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        const d = dist(b.x, b.y, e.x, e.y);
                        if (d < b.radius + e.size * 0.4) {
                            // 命中！
                            bullets.splice(i, 1);
                            enemies.splice(j, 1);

                            // 得分
                            const bonus = 1 + Math.floor(combo / 5);
                            const points = 10 * bonus;
                            score += points;
                            combo++;
                            if (combo > maxCombo) maxCombo = combo;
                            updateHUD();

                            // 特效
                            emitExplosion(e.x, e.y, 35 + combo * 2, e.color, 6, 45);
                            emitScoreParticles(e.x, e.y);

                            // 连击显示
                            if (combo >= 3) {
                                comboDisplay.classList.add('show');
                                comboCount.textContent = combo;
                                // 闪烁
                                clearTimeout(window.comboTimeout);
                                window.comboTimeout = setTimeout(() => {
                                    comboDisplay.classList.remove('show');
                                }, 1200);
                            }

                            // 更新难度
                            updateDifficulty();

                            break;
                        }
                    }
                }
            }

            // ============================================================
            //  生命 & 游戏结束
            // ============================================================
            function loseLife() {
                lives--;
                combo = 0;
                updateHUD();
                // 屏幕震动效果（通过闪烁）
                if (lives <= 0) {
                    gameOver();
                } else {
                    // 玩家闪烁（在draw里处理）
                    emitExplosion(player.x, player.y, 20, '#f472b6', 4, 30);
                }
            }

            function gameOver() {
                state = STATE.GAMEOVER;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('boomPC_best', String(bestScore));
                }
                finalScoreEl.textContent = score;
                bestScoreEl.textContent = bestScore;
                // 表情
                if (score >= 200) endEmojiEl.textContent = '🏆';
                else if (score >= 100) endEmojiEl.textContent = '🌟';
                else if (score >= 50) endEmojiEl.textContent = '💪';
                else if (score >= 20) endEmojiEl.textContent = '😅';
                else endEmojiEl.textContent = '💻';
                showPanel(endPanel);
            }

            // ============================================================
            //  难度系统
            // ============================================================
            function updateDifficulty() {
                difficulty = 1 + Math.floor(score / 25) * 0.5;
                difficulty = Math.min(difficulty, 8);
                // 更新UI
                const pct = (difficulty / 8) * 100;
                diffFill.style.width = Math.min(pct, 100) + '%';
            }

            // ============================================================
            //  HUD 更新
            // ============================================================
            function updateHUD() {
                scoreDisplay.textContent = score;
                // 生命值
                livesDisplay.innerHTML = '';
                for (let i = 0; i < MAX_LIVES; i++) {
                    const span = document.createElement('span');
                    span.className = 'life-icon' + (i >= lives ? ' lost' : '');
                    span.textContent = '❤️';
                    livesDisplay.appendChild(span);
                }
                // 连击
                if (combo >= 3) {
                    comboDisplay.classList.add('show');
                    comboCount.textContent = combo;
                } else {
                    comboDisplay.classList.remove('show');
                }
                updateDifficulty();
            }

            // ============================================================
            //  UI 面板控制
            // ============================================================
            function showPanel(panel) {
                [startPanel, endPanel].forEach(p => p.classList.remove('visible'));
                if (panel) {
                    panel.classList.add('visible');
                    uiOverlay.classList.add('active');
                } else {
                    uiOverlay.classList.remove('active');
                }
            }

            // ============================================================
            //  游戏控制
            // ============================================================
            function resetGame() {
                score = 0;
                lives = MAX_LIVES;
                combo = 0;
                maxCombo = 0;
                difficulty = 1;
                frameCount = 0;
                fireCounter = 0;
                spawnCounter = 0;
                bullets = [];
                enemies = [];
                particles = [];
                player.x = W / 2;
                player.targetX = W / 2;
                updateHUD();
                diffFill.style.width = '0%';
                comboDisplay.classList.remove('show');
            }

            function startGame() {
                resetGame();
                showPanel(null);
                state = STATE.PLAYING;
            }

            // ============================================================
            //  背景绘制
            // ============================================================
            function drawBackground() {
                // 深空渐变
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#0a0a14');
                grad.addColorStop(0.4, '#0f0a24');
                grad.addColorStop(0.7, '#140a1e');
                grad.addColorStop(1, '#0a0a14');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // 星星
                for (const s of stars) {
                    s.y += s.speed;
                    if (s.y > H) {
                        s.y = 0;
                        s.x = Math.random() * W;
                    }
                    const alpha = s.a * (0.7 + 0.3 * Math.sin(frameCount * 0.01 + s.x));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                }

                // 底部发光网格线
                ctx.strokeStyle = 'rgba(167, 139, 250, 0.02)';
                ctx.lineWidth = 1;
                for (let i = 0; i < W; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(i, H - 20);
                    ctx.lineTo(i + 10, H);
                    ctx.stroke();
                }
                for (let i = 0; i < H; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, H - i);
                    ctx.lineTo(W, H - i);
                    ctx.stroke();
                }

                // 底部光晕
                const grad2 = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, H * 0.5);
                grad2.addColorStop(0, 'rgba(167, 139, 250, 0.04)');
                grad2.addColorStop(1, 'transparent');
                ctx.fillStyle = grad2;
                ctx.fillRect(0, 0, W, H);
            }

            // ============================================================
            //  主循环
            // ============================================================
            function gameLoop() {
                frameCount++;

                // --- 更新 ---
                if (state === STATE.PLAYING) {
                    // 射击
                    fireCounter++;
                    const fireInterval = Math.max(4, BASE_FIRE_INTERVAL - Math.floor(difficulty * 0.5));
                    if (fireCounter >= fireInterval) {
                        fireCounter = 0;
                        fireBullet();
                    }

                    // 生成敌人
                    spawnCounter++;
                    const spawnInterval = Math.max(12, BASE_ENEMY_SPAWN - Math.floor(difficulty * 2.5));
                    if (spawnCounter >= spawnInterval) {
                        spawnCounter = 0;
                        const count = Math.min(3, 1 + Math.floor(difficulty / 2.5));
                        for (let i = 0; i < count; i++) {
                            setTimeout(() => { spawnEnemy(); }, i * 100);
                        }
                        spawnEnemy();
                    }

                    updateBullets();
                    updateEnemies();
                    checkCollisions();
                    updatePlayer();
                    updateParticles();

                    // 更新触摸跟随
                    if (isTouching) {
                        player.targetX = touchX;
                    }

                } else if (state === STATE.MENU) {
                    updateParticles();
                    // 菜单动画：玩家浮动
                    player.x = W / 2 + Math.sin(frameCount * 0.015) * 30;
                    player.y = H - 60 - player.radius + Math.sin(frameCount * 0.02) * 8;
                    player.targetX = player.x;
                    player.engineGlow += 0.08;
                } else {
                    // GAMEOVER
                    updateParticles();
                }

                // --- 渲染 ---
                drawBackground();

                // 画子弹（在敌人下方）
                drawBullets();

                // 画敌人
                drawEnemies();

                // 画粒子（在玩家下方，但有些在玩家上方）
                drawParticles();

                // 画玩家
                if (state === STATE.MENU || state === STATE.PLAYING) {
                    drawPlayer();
                } else if (state === STATE.GAMEOVER) {
                    // 游戏结束也画玩家，但半透明
                    ctx.globalAlpha = 0.4;
                    drawPlayer();
                    ctx.globalAlpha = 1;
                    // 暗色遮罩
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(0, 0, W, H);
                }

                // 调试信息（可选）
                // ctx.fillStyle = 'rgba(255,255,255,0.05)';
                // ctx.font = '10px monospace';
                // ctx.fillText(`en:${enemies.length} b:${bullets.length} p:${particles.length} diff:${difficulty.toFixed(1)}`, 10, 30);

                requestAnimationFrame(gameLoop);
            }

            // ============================================================
            //  触摸事件
            // ============================================================
            function handleTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (!touch) return;
                const rect = canvas.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;

                isTouching = true;
                touchX = x;

                if (state === STATE.PLAYING) {
                    player.targetX = x;
                }
            }

            function handleTouchMove(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (!touch) return;
                const rect = canvas.getBoundingClientRect();
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;

                touchX = x;
                if (state === STATE.PLAYING) {
                    player.targetX = x;
                }
            }

            function handleTouchEnd(e) {
                e.preventDefault();
                isTouching = false;
                // 不重置目标，让玩家停在最后位置
            }

            function handleTouchCancel(e) {
                e.preventDefault();
                isTouching = false;
            }

            // --- 注册触摸 ---
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchCancel, { passive: false });

            // --- 阻止鼠标事件 ---
            canvas.addEventListener('mousedown', (e) => e.preventDefault());
            canvas.addEventListener('mousemove', (e) => e.preventDefault());
            canvas.addEventListener('mouseup', (e) => e.preventDefault());

            // --- 按钮事件 ---
            startBtn.addEventListener('touchstart', (e) => { e.preventDefault();
                startGame(); });
            startBtn.addEventListener('mousedown', (e) => e.preventDefault());

            restartBtn.addEventListener('touchstart', (e) => { e.preventDefault();
                startGame(); });
            restartBtn.addEventListener('mousedown', (e) => e.preventDefault());

            [startBtn, restartBtn].forEach(btn => {
                btn.addEventListener('touchstart', (e) => e.stopPropagation());
            });

            // --- 阻止页面滚动 ---
            document.addEventListener('touchmove', (e) => {
                if (e.target === canvas || e.target.closest('#gameContainer')) {
                    e.preventDefault();
                }
            }, { passive: false });

            // ============================================================
            //  窗口变化
            // ============================================================
            window.addEventListener('resize', () => {
                resizeCanvas();
                initStars();
                if (state === STATE.MENU) {
                    player.x = W / 2;
                    player.targetX = W / 2;
                }
                player.y = H - 60 - player.radius;
            });

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                player.x = W / 2;
                player.targetX = W / 2;
                player.y = H - 60 - player.radius;
                updateHUD();
                showPanel(startPanel);
                state = STATE.MENU;
                // 更新最高分显示
                bestScoreEl.textContent = bestScore;
                gameLoop();
                console.log('💥 BoomPC 已启动 — 手机射击');
            }

            init();

        })();
    </script>
</body>
