<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2e6b">
<title>Pay_Attention · 付款</title>
<style>
:root{
  --brand:#0b2e6b; --brand-600:#123f8a; --brand-soft:#eef3fb;
  --ink:#0e1726; --ink-2:#4a5568; --ink-3:#8b95a5;
  --line:#e2e8f0; --surface:#fff; --pos:#0f7b3f; --neg:#b42318; --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#e9edf3;color:var(--ink);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-size:15px;line-height:1.5;
}
@media (min-width:480px){body{display:flex;align-items:center;justify-content:center}}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}

#app{
  width:100%;max-width:440px;height:100dvh;margin:0 auto;
  background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative;
}
@media (min-width:480px){
  #app{height:min(880px,calc(100dvh - 48px));border-radius:16px;
    box-shadow:0 0 0 1px rgba(15,23,42,.06),0 28px 70px -32px rgba(15,23,42,.45)}
}

.topbar{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:-.3px}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:-.3px}

main{flex:1;overflow-y:auto;padding:24px 20px 32px}

.payee-card{display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 20px;margin-bottom:24px;border:1px solid var(--line);border-radius:var(--r)}
.payee-av{width:56px;height:56px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin-bottom:12px}
.payee-name{font-size:18px;font-weight:700;letter-spacing:-.3px;word-break:break-word;text-align:center}
.payee-role{font-size:12.5px;color:var(--ink-3);margin-top:4px}

.form-label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.amount-wrap{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);
  padding:10px 14px;background:var(--surface);transition:.15s;margin-bottom:10px}
.amount-wrap:focus-within{border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(11,46,107,.08)}
.amount-wrap span{font-size:22px;font-weight:600;color:var(--ink-3)}
.amount-wrap input{flex:1;min-width:0;border:0;outline:none;background:transparent;
  font-size:25px;font-weight:650;letter-spacing:-.5px}
.amount-wrap input::placeholder{color:#cdd5e0;font-weight:500}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:9px 0;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.12s}
.quick button:hover{background:#f4f6fa;color:var(--ink)}

.field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);margin-bottom:20px;outline:none;transition:.15s}
.field::placeholder{color:#b6bfcc}
.field:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px rgba(11,46,107,.08)}

.btn{width:100%;border:1px solid transparent;border-radius:var(--r);padding:13px 16px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:#f4f6fa}
.btn:disabled{opacity:.45;pointer-events:none}

.privacy-note{text-align:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.privacy-note a{color:#2563eb;font-size:12.5px;text-decoration:none;
  border-bottom:1px dashed rgba(37,99,235,.4);cursor:pointer;transition:.15s}
.privacy-note a:hover{color:#1d4ed8;border-bottom-color:#1d4ed8}

.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(9,16,30,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:auto}
.modal.center{align-items:center}
.modal-card{width:100%;max-width:440px;background:var(--surface);border-radius:16px 16px 0 0;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(20px);transition:transform .24s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto}
.modal.show .modal-card{transform:translateY(0)}
.modal.center .modal-card{border-radius:16px;max-width:300px;margin:0 18px;text-align:center;padding:30px 22px;transform:scale(.96)}
.modal.show.center .modal-card{transform:scale(1)}
.modal-card h3{margin:0 0 18px;font-size:16px;font-weight:650;letter-spacing:-.2px}

.pay-summary{text-align:center;padding:6px 0 2px}
.pay-summary .ps-amt{font-size:28px;font-weight:700;letter-spacing:-1px}
.pay-summary .ps-to{font-size:13px;color:var(--ink-3);margin-top:4px}
.pin-wrap{position:relative;display:flex;gap:9px;justify-content:center;margin:22px 0 6px}
.pin-cells{display:flex;gap:9px}
.pin-cell{width:42px;height:52px;border:1.5px solid var(--line);border-radius:10px;
  display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff}
.pin-cell.filled{border-color:var(--brand-600);background:#fbfcff}
.pin-cell.filled::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--brand)}
.pin-input{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;background:transparent;
  color:transparent;caret-color:transparent;font-size:16px;opacity:0}

.err{color:var(--neg);font-size:12.5px;min-height:18px;margin-bottom:10px;line-height:1.45}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1;width:auto}

.success-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;background:#eefaf2;color:var(--pos);
  display:flex;align-items:center;justify-content:center}
.success-icon svg{width:26px;height:26px}
.success-title{font-size:15px;font-weight:650;margin-bottom:6px}
.success-amt{font-size:26px;font-weight:700;letter-spacing:-.8px;color:var(--pos);margin-bottom:4px}
.success-to{font-size:12.5px;color:var(--ink-3)}
.success-privacy{display:flex;align-items:center;justify-content:center;gap:5px;
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.success-privacy svg{width:12px;height:12px}

.privacy-body{font-size:13.5px;color:var(--ink-2);line-height:1.75}
.privacy-body p{margin:0 0 12px}
.privacy-body p:last-child{margin:0}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,8px);background:#0e1726;color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:.2s;z-index:300;
  pointer-events:none;max-width:86vw;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}

.error-page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.error-icon{width:64px;height:64px;border-radius:50%;background:#fdf1f0;color:var(--neg);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.error-icon svg{width:30px;height:30px}
.error-title{font-size:17px;font-weight:700;margin-bottom:8px}
.error-desc{font-size:13.5px;color:var(--ink-3);line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand-mark">PA</div>
    <div class="brand-name">Pay_Attention</div>
  </header>

  <div id="mainContent" class="hidden">
    <main>
      <div class="payee-card">
        <div class="payee-av" id="payeeAvatar">?</div>
        <div class="payee-name" id="payeeName">—</div>
        <div class="payee-role" data-i18n="payeeRole">收款方</div>
      </div>

      <label class="form-label" data-i18n="amount">金额</label>
      <div class="amount-wrap">
        <span>$</span>
        <input id="amountInput" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      </div>

      <div class="quick">
        <button data-amt="5">$5</button>
        <button data-amt="10">$10</button>
        <button data-amt="25">$25</button>
        <button data-amt="50">$50</button>
      </div>

      <label class="form-label" data-i18n="note">备注（选填）</label>
      <input class="field" id="noteInput" placeholder="备注（选填）">

      <button class="btn primary" id="payBtn" data-i18n="payNow">付款</button>

      <div class="privacy-note">
        <a href="#" id="privacyLink" data-i18n="whyAnonymous">为什么付款人信息不显示？</a>
      </div>
    </main>
  </div>

  <div id="errorPage" class="error-page hidden">
    <div class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
    </div>
    <div class="error-title">无法打开收款页</div>
    <div class="error-desc">链接无效或已过期，请向收款方重新获取收款码。</div>
  </div>
</div>

<div class="modal" id="pinModal">
  <div class="modal-card">
    <h3 data-i18n="enterPin">输入支付密码</h3>
    <div class="pay-summary">
      <div class="ps-amt" id="pinAmount">$0.00</div>
      <div class="ps-to" id="pinTo">—</div>
    </div>
    <div class="pin-wrap">
      <div class="pin-cells" id="pinCells">
        <div class="pin-cell"></div><div class="pin-cell"></div><div class="pin-cell"></div>
        <div class="pin-cell"></div><div class="pin-cell"></div><div class="pin-cell"></div>
      </div>
      <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
    </div>
    <div class="err" id="pinErr" style="text-align:center"></div>
    <div class="row">
      <button class="btn ghost" id="pinCancel" data-i18n="cancel">取消</button>
      <button class="btn primary" id="pinConfirm" data-i18n="confirm">确认付款</button>
    </div>
  </div>
</div>

<div class="modal center" id="successModal">
  <div class="modal-card">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="success-title" data-i18n="paymentComplete">付款完成</div>
    <div class="success-amt" id="successAmt">$0.00</div>
    <div class="success-to" id="successTo">—</div>
    <div class="success-privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span data-i18n="privacyProtected">付款人信息已加密保护</span>
    </div>
  </div>
</div>

<div class="modal" id="privacyModal">
  <div class="modal-card">
    <h3 data-i18n="privacyTitle">付款人隐私保护</h3>
    <div class="privacy-body">
      <p data-i18n="privacyP1">为保护交易双方的账户安全与个人隐私，Pay_Attention 对付款方的身份信息进行加密处理。</p>
      <p data-i18n="privacyP2">收款方仅可查看入账金额、时间与备注，无法获取付款方的账户名称或其他身份信息。</p>
      <p data-i18n="privacyP3">此机制可有效防止账户被滥用、骚扰或用于其他不当用途，符合支付行业通行的隐私保护标准。</p>
    </div>
    <div class="row">
      <button class="btn primary" id="privacyClose" data-i18n="gotIt">我知道了</button>
    </div>
  </div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const hashPass = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'h' + (h >>> 0).toString(36); };
const fmtUSD = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const LANG_KEY = 'pay_attention_lang';
let lang = localStorage.getItem(LANG_KEY) || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');

const I18N = {
  zh: {
    payeeRole:'收款方', amount:'金额', note:'备注（选填）', payNow:'付款',
    whyAnonymous:'为什么付款人信息不显示？',
    enterPin:'输入支付密码', cancel:'取消', confirm:'确认付款',
    paymentComplete:'付款完成', privacyProtected:'付款人信息已加密保护',
    privacyTitle:'付款人隐私保护',
    privacyP1:'为保护交易双方的账户安全与个人隐私，Pay_Attention 对付款方的身份信息进行加密处理。',
    privacyP2:'收款方仅可查看入账金额、时间与备注，无法获取付款方的账户名称或其他身份信息。',
    privacyP3:'此机制可有效防止账户被滥用、骚扰或用于其他不当用途，符合支付行业通行的隐私保护标准。',
    gotIt:'我知道了',
    errAmount:'请输入有效金额', errPinFormat:'请输入 6 位支付密码',
    errPinWrong:'支付密码错误', errBalance:'余额不足',
    payTo:'收款方：', successToPrefix:'已支付给 '
  },
  en: {
    payeeRole:'Payee', amount:'Amount', note:'Note (optional)', payNow:'Pay',
    whyAnonymous:'Why is the payer hidden?',
    enterPin:'Enter payment PIN', cancel:'Cancel', confirm:'Confirm',
    paymentComplete:'Payment complete', privacyProtected:'Payer information is encrypted',
    privacyTitle:'Payer privacy protection',
    privacyP1:'To protect both parties, Pay_Attention encrypts the payer\'s identity information.',
    privacyP2:'The payee can only see the amount, time and note of incoming payments — never the payer\'s account name or other identity details.',
    privacyP3:'This mechanism prevents abuse, harassment and other misuse, and follows standard payment-industry privacy practices.',
    gotIt:'Got it',
    errAmount:'Please enter a valid amount', errPinFormat:'Please enter your 6-digit PIN',
    errPinWrong:'Incorrect payment PIN', errBalance:'Insufficient balance',
    payTo:'To: ', successToPrefix:'Paid to '
  }
};
const t = k => (I18N[lang] && I18N[lang][k] !== undefined) ? I18N[lang][k] : k;
function applyLang(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
}

const params = new URLSearchParams(location.search);
const rawPayee = (params.get('pay') || params.get('to') || '').trim();
let payeeName = '';
try { payeeName = rawPayee ? decodeURIComponent(rawPayee) : ''; } catch(e) { payeeName = rawPayee; }

const DB_KEY = 'pay_attention_db_v2';
function loadDB(){
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw){ const d = JSON.parse(raw); if (d && d.users) return d; }
  } catch(e){}
  return null;
}
let DB = loadDB();
const me = () => (DB && DB.session && DB.users[DB.session]) ? DB.users[DB.session] : null;
const saveDB = () => { if (DB) localStorage.setItem(DB_KEY, JSON.stringify(DB)); };

let pendingAmount = 0, pendingNote = '';

function init(){
  applyLang();
  if (!payeeName){ showError(); return; }
  $('#payeeName').textContent = payeeName;
  $('#payeeAvatar').textContent = payeeName.charAt(0).toUpperCase();
  $('#mainContent').classList.remove('hidden');
  bindEvents();
}
function showError(){
  $('#mainContent').classList.add('hidden');
  $('#errorPage').classList.remove('hidden');
}

function openPinModal(){
  const raw = parseFloat($('#amountInput').value);
  if (!(raw > 0) || !isFinite(raw)){ toast(t('errAmount')); return; }
  pendingAmount = Math.round(raw * 100) / 100;
  pendingNote = $('#noteInput').value.trim();
  $('#pinAmount').textContent = fmtUSD(pendingAmount);
  $('#pinTo').textContent = t('payTo') + payeeName;
  $('#pinErr').textContent = '';
  $('#pinInput').value = '';
  updatePinCells();
  showModal('#pinModal');
  setTimeout(() => $('#pinInput').focus(), 220);
}

function updatePinCells(){
  const val = $('#pinInput').value;
  $$('#pinCells .pin-cell').forEach((c, i) => c.classList.toggle('filled', i < val.length));
}

function submitPayment(){
  const pin = $('#pinInput').value;
  if (!/^\d{6}$/.test(pin)){ $('#pinErr').textContent = t('errPinFormat'); return; }

  const payer = me();
  if (payer){
    if (payer.payPass !== hashPass(pin)){ $('#pinErr').textContent = t('errPinWrong'); return; }
    if (payer.balance < pendingAmount){ $('#pinErr').textContent = t('errBalance'); return; }
    payer.balance = Math.round((payer.balance - pendingAmount) * 100) / 100;
    if (DB.users[payeeName]){
      DB.users[payeeName].balance = Math.round((DB.users[payeeName].balance + pendingAmount) * 100) / 100;
    }
    DB.tx.unshift({
      id: uid(), type: 'pay', from: payer.name, to: payeeName,
      amount: pendingAmount, note: pendingNote, ts: Date.now()
    });
    saveDB();
  }

  closeModal('#pinModal');
  $('#successAmt').textContent = fmtUSD(pendingAmount);
  $('#successTo').textContent = t('successToPrefix') + payeeName;
  showModal('#successModal');
  setTimeout(() => closeModal('#successModal'), 3200);
}

const showModal = sel => { const m = $(sel); if (m) m.classList.add('show'); };
const closeModal = sel => { const m = $(sel); if (m) m.classList.remove('show'); };

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 260); }, 2200);
}

function bindEvents(){
  $$('.quick button').forEach(b => {
    b.addEventListener('click', () => {
      $('#amountInput').value = b.dataset.amt;
      $('#amountInput').focus();
    });
  });
  $('#payBtn').addEventListener('click', openPinModal);
  $('#amountInput').addEventListener('keydown', e => { if (e.key === 'Enter') openPinModal(); });
  $('#pinCancel').addEventListener('click', () => closeModal('#pinModal'));
  $('#pinConfirm').addEventListener('click', submitPayment);
  const pinInput = $('#pinInput');
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 6);
    updatePinCells();
    $('#pinErr').textContent = '';
    if (pinInput.value.length === 6) submitPayment();
  });
  $('#privacyLink').addEventListener('click', e => { e.preventDefault(); showModal('#privacyModal'); });
  $('#privacyClose').addEventListener('click', () => closeModal('#privacyModal'));
  $$('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
